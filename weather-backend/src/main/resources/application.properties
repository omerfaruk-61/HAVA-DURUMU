spring.application.name=weather-backend

# MySQL Veri Tabanı Bağlantısı
spring.datasource.url=jdbc:mysql://localhost:3306/weather_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# OpenWeatherMap API Key
weather.api.key=YOUR_OPENWEATHERMAP_API_KEY
spring.jpa.open-in-view=false